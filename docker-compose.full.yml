# Ambiente local próximo de produção: bucket S3 privado e antivírus (ClamAV).
# Uso: docker compose -f docker-compose.yml -f docker-compose.full.yml up --build
# O ClamAV leva alguns minutos na primeira subida para baixar as assinaturas.
#
# O S3 local usa o s3proxy (mesma implementação dos testes) com disco como
# backend; em produção, aponte S3_* para um bucket privado real (S3, R2, B2...).
services:
  # Cria o "bucket" (diretório) no volume antes de o s3proxy subir.
  s3-init:
    image: busybox:1.37
    command: mkdir -p /data/guardadoc-documentos
    volumes:
      - s3data:/data

  s3:
    image: andrewgaul/s3proxy:4.2.0
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: guardadoc
      S3PROXY_CREDENTIAL: guardadoc-s3-local
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    volumes:
      - s3data:/data

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      start_period: 300s
      retries: 10

  app:
    depends_on:
      s3:
        condition: service_started
      clamav:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: guardadoc-documentos
      S3_ENDPOINT: http://s3:80
      S3_REGION: us-east-1
      S3_PATH_STYLE: "true"
      S3_SSE: "false" # s3proxy local não suporta SSE; em produção mantenha true
      S3_ACCESS_KEY_ID: guardadoc
      S3_SECRET_ACCESS_KEY: guardadoc-s3-local
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

volumes:
  s3data:
  clamav:
